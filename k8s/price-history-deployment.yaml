apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-history
  labels:
    app: price-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-history
  template:
    metadata:
      labels:
        app: price-history
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z kafka 9092; do echo "Waiting for Kafka..."; sleep 5; done;' ]
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for Postgres..."; sleep 5; done;' ]
      containers:
        - name: price-history
          image: price_history:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KF_TOPIC
              value: "topic1"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "price_history_db"
            - name: DB_USERNAME
              value: admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: price-history
spec:
  type: ClusterIP
  selector:
    app: price-history
  ports:
    - port: 8080
      targetPort: 8080
