version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: pet_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.7
    container_name: pet_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.7
    container_name: pet_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "topic1:3:1"
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  core_crm:
    build:
      context: ./CoreCRM
    container_name: core_crm
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crm_db
      DB_USERNAME: admin
      DB_PASSWORD: 123
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  content_loader:
    build:
      context: ./ContentLoaderAdapter
    container_name: content_loader
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KF_TOPIC: topic1
      DATA_DIR: /app/contentLoaderAdapter/data
    volumes:
      - ./ContentLoaderAdapter/data:/app/contentLoaderAdapter/data
    depends_on:
      kafka:
        condition: service_healthy

  content_processor:
    build:
      context: ./ContentProcess
    container_name: content_processor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KF_TOPIC: topic1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: content_processor_db
      DB_USERNAME: admin
      DB_PASSWORD: 123
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  price_history:
    build:
      context: ./PriceHistory
    container_name: price_history
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KF_TOPIC: topic1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: price_history_db
      DB_USERNAME: admin
      DB_PASSWORD: 123
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification_sender:
    build:
      context: ./NotificationSender
    container_name: notification_sender
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KF_TOPIC: topic1
      MAIL_USERNAME: timofei.timoshenko@yandex.ru
      MAIL_PASSWORD: ucwkhvziqixinlra
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:

